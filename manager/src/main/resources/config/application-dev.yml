server:
  port: 7000
  servlet:
    context-path: /
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/codelooms?allowPublicKeyRetrieval=true
    username: ${DB_USER_NAME}
    password: ${DB_PASSWORD}
    hikari:
      auto-commit: true
      idle-timeout: 30000
      connection-time: 30000
      minimum-idle: 1
      maximum-pool-size: 5
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
feign:
  client:
    config:
      default:
        connectTimeout: 100000
        readTimeout: 100000
        loggerLevel: basic
config:
  file:
    save-mode: local
    base-path: ${BASE_PATH}
  model-service: ${MODEL_SERVICE}
